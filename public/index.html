tr.alt td{color:var(--bad);font-weight:700}

.fb{border-radius:14px;padding:12px 14px;margin:10px 0;border:2px solid}

.ckr{font-size:15px}

.seg{display:flex;gap:6px;margin-top:8px}

.ovc{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}

.badge{display:flex;gap:10px;align-items:center;padding:8px 0}

.cert{border:3px double var(--accent);border-radius:18px;padding:18px;text-align:center;background:var(--card)}

details.rv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}

.rvi{border-top:1px solid var(--line);padding:8px 0;font-size:15px}
.rvi.crit{border-left:4px solid var(--bad);padding-left:8px}
.rok{color:var(--ok);font-weight:700}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 Q('¿Desde qué valores se habla de crisis hipertensiva?',['PAS de 160 o más y/o PAD de 110 o más','PAS de 140 o más y/o PAD de 90 o más','PAS de 180 o más y PAD de 120 o más','PAS de 150 o más'],[],'La crisis hipertensiva se define con PAS de 160 o más y/o PAD de 110 o más.','OPS 2024, cap. 1'),

{id:'1.5',lv:0,t:'¿Es una sepsis?',ctx:'Puérpera de 4 días poscesárea. Temperatura de 38,4 °C, FC 116 y FR 26 sostenidas por más de 15 minutos. Loquios con mal olor.',img:{k:'mon',v:{TA:'104/62',FC:'116',FR:'26',SpO2:'96',T:'38,4'},alt:['FC','FR','T'],cap:'Monitor de la paciente'},q:[

 Q('¿Qué nivel de riesgo corresponde a una suma SATO de 5?',['Mediano riesgo de deterioro: informar al equipo secundario, registrar y reevaluar en 30 a 60 minutos','Bajo riesgo: control habitual cada 6 horas','Alto riesgo: monitoreo continuo','Rutina, porque ningún parámetro suma 3'],[],'Con el SATO, una suma de 4 o 5, o un parámetro aislado con 3 puntos, es riesgo intermedio: observación al menos cada hora y llamado urgente al equipo a cargo.','Algoritmo SATO, Argentina'),
 Q('En otra paciente un solo parámetro suma 3 y el total es 3. ¿Cómo se clasifica?',['Riesgo intermedio','Riesgo bajo, porque la suma es 3','Rutina','Riesgo alto'],[],'Un parámetro con 3 puntos basta para el riesgo intermedio, aunque la suma sea baja.','Algoritmo SATO, Argentina'),

 Q('¿Qué se hace?',['Activar el Código Rojo: dos vías, laboratorio, hemocomponentes y pase a terapia intensiva','Seguir controlando cada hora','Cambiar los apósitos y esperar','Dar un analgésico'],[1,2,3],'La combinación de pérdida visible, taquicardia, taquipnea e índice de shock elevado activa el Código Rojo.','OPS 2024, cap. 8')]},
{id:'2.3',lv:1,t:'Cuánto sangró',ctx:'Puérpera que sangra desde hace 30 minutos. Está agitada.',img:{k:'mon',v:{TA:'75/48',FC:'112',FR:'26',SpO2:'94',T:'36,0'},alt:['FC','TA'],cap:'Monitor de la paciente'},rows:[['Llenado capilar','3 s'],['Sensorio','Agitada']],q:[

 Q('¿Por qué la TA puede engañar en la puérpera?',['La hipervolemia del embarazo sostiene la TA hasta pérdidas grandes, y la hipotensión aparece tarde','Porque los tensiómetros fallan en el embarazo','Porque la TA sube cuando sangra','No engaña: es el mejor signo temprano'],[],'Por eso se miran juntas la FC, el sensorio, el llenado capilar y el índice de shock.','OPS 2024, cap. 8'),

 Q('¿Qué complicación hay que sospechar?',['Edema pulmonar','Ansiedad nocturna','Reflujo gastroesofágico','Cansancio propio del embarazo'],[],'El edema pulmonar es un criterio de severidad de la preeclampsia.','OPS 2024, cap. 1'),
 Q('¿Qué se hace?',['Llamar de inmediato al médico, sentarla, dar oxígeno y comunicar con SBAR','Anotar y avisar en el pase de la mañana','Pasar más líquidos','Acostarla boca arriba y esperar'],[1,2,3],'Se activa la respuesta rápida con un llamado y una comunicación estructurada.','OPS 2024, cap. 9')]},

{id:'3.1',lv:2,t:'Código Rojo: los primeros minutos',ctx:'Puérpera de 1 hora posparto vaginal. Sangrado abundante, pálida y sudorosa. Se activa el Código Rojo.',img:{k:'mon',v:{TA:'88/56',FC:'118',FR:'26',SpO2:'95',T:'36,1'},alt:['FC','TA'],cap:'Monitor al activar el código'},ck:{e:'hpp',tt:'primeros minutos del Código Rojo',st:['La partera pide ayuda y activa el Código Rojo.','El obstetra se ubica en la pelvis y comienza el masaje bimanual.','Anestesia evalúa la vía aérea y coloca oxígeno con máscara con reservorio.','Enfermería coloca una vía de 18 G y conecta un cristaloide a temperatura ambiente.','Se extraen muestras para laboratorio y pruebas cruzadas.'],pie:'La escena muestra los primeros cinco minutos. No muestra cómo se mide la pérdida.',v:[1,1,1,2,1,3,2],n:{3:'Una sola vía de 18 G: el Código Rojo pide dos accesos gruesos, de 14 a 16 G.',6:'El cristaloide se pasa tibio y la paciente se abriga: la hipotermia es parte del diamante de la muerte.'}},q:[
 Q('¿Qué hace enfermería desde el brazo?',['Accesos, muestras, medicación, líquidos, hemocomponentes y control de pulsos','Masaje bimanual y búsqueda de la causa','Vía aérea, oxigenación y registro de tiempos','Llamar a la familia'],[],'En el Código Rojo la pelvis es del obstetra, la cabeza de anestesia y el brazo de enfermería.','OPS 2024, cap. 8'),
 Q('¿Qué integra el diamante de la muerte?',['Acidosis, coagulopatía, hipotermia e hipocalcemia','Fiebre, taquicardia, anemia y dolor','Hipertensión, edema, proteinuria y cefalea','Hipoglucemia, hiperpotasemia, alcalosis y bradicardia'],[],'Son las alteraciones que se potencian entre sí en la hemorragia masiva.','OPS 2024, cap. 8'),
 Q('¿Qué uterotónico y qué esquema de ácido tranexámico corresponden?',['Oxitocina IV en infusión y ácido tranexámico 1 g IV lento apenas se reconoce la hemorragia','Ergometrina IV en bolo y ácido tranexámico a las 6 horas','Solo ácido tranexámico, sin uterotónicos','Esperar el laboratorio para indicar el ácido tranexámico'],[1,3],'Oxitocina 20 UI en 500 mL por bomba. Ácido tranexámico 1 g a 1 mL/min, con una segunda dosis si sigue sangrando a los 30 minutos.','OPS 2024, cap. 8')]},
{id:'3.2',lv:2,t:'Crisis hipertensiva',ctx:'Gestante de 34 semanas con preeclampsia. TA 168/112 en dos tomas separadas por 15 minutos. Cefalea intensa.',img:{k:'mon',v:{TA:'168/112',FC:'96',FR:'18',SpO2:'97',T:'36,6'},alt:['TA'],cap:'Monitor de la paciente'},ck:{e:'hta',tt:'primeros 15 minutos',st:['Se controla la TA cada 5 minutos.','Se colocan dos vías periféricas con catéter 16.','Se extrae laboratorio: hemograma con plaquetas, LDH, TGO y TGP, creatinina.','Como primera medida se da nifedipina 10 mg por vía sublingual.','Se inicia la dosis de ataque de sulfato de magnesio: 5 g en 100 mL, a pasar en 20 minutos con bomba.'],pie:'La escena muestra los primeros 15 minutos. Todavía no corresponden los controles del magnesio.',v:[1,1,1,2,1,3,3],n:{3:'La primera línea es labetalol 20 mg EV lento. La nifedipina se agrega recién a los 60 minutos si la TA no bajó, y siempre por vía oral, nunca sublingual.',5:'Todavía no corresponde valorarlos en la escena.',6:'La escena no muestra si el gluconato de calcio está a mano.'}},q:[
 Q('¿En cuánto tiempo hay que tratar la TA?',['En los primeros 15 minutos','En la primera hora','Cuando aparezca una convulsión','En 6 horas'],[],'Con TA de 160/110 o más el tratamiento empieza dentro de los 15 minutos.','OPS 2024, cap. 1'),
 Q('¿Cuál es la meta de TA en la primera hora?',['PAS de 130 a 150 y PAD de 80 a 100','Llegar a 110/70 lo antes posible','Por debajo de 120/80','No hay meta'],[],'Un descenso brusco compromete la perfusión placentaria.','OPS 2024, cap. 1'),
 Q('Se dio labetalol 20 mg EV lento y a los 15 minutos la TA no bajó. ¿Qué sigue?',['Labetalol 40 mg EV lento; si no baja, 80 mg a los 30 y a los 45 minutos, y a los 60 minutos agregar nifedipina oral 10 a 20 mg','Repetir 20 mg cada 5 minutos sin límite','Pasar a nifedipina sublingual','Esperar una hora antes de repetir'],[1,2,3],'El esquema es minuto 0: 20 mg; minuto 15: 40 mg; minutos 30 y 45: 80 mg; minuto 60: se agrega nifedipina oral. Siempre EV lento y con control de TA cada 5 minutos.','Algoritmo HTA/PE, Argentina')]},
{id:'3.3',lv:2,t:'Sulfato de magnesio',ctx:'Puérpera con preeclampsia severa, 70 kg. Se indica sulfato de magnesio. En la mesa hay ampollas de 5 mL al 25%, solución fisiológica, dextrosa al 5% y gluconato de calcio al 10%.',img:{k:'tags',items:['Ataque: 5 g EV en 20 minutos','Mantenimiento: 1 g/h por 24 horas','Gluconato de calcio al 10%'],cap:'Lo indicado y lo que hay en la mesa'},q:[

 Q('¿Cómo se arma y se pasa el mantenimiento?',['24 g, que son 19 ampollas al 25%, en 405 mL de dextrosa al 5% o fisiológica, a 1 g/h por bomba durante 24 horas sin síntomas','2 g/h hasta que baje la TA','Solo durante la cesárea','12 horas fijas, sin bomba'],[],'1 g/h equivale a unos 21 mL/h por bomba, o 7 gotas por minuto con macrogotero. En la eclampsia se mantiene al menos 48 horas.','Algoritmo HTA/PE, Argentina, OPS 2024 cap. 1'),
 Q('A las 6 horas: reflejo patelar ausente, FR 10 y diuresis de 20 mL/h. ¿Qué se hace?',['Suspender la infusión, avisar y dar gluconato de calcio al 10%, 1 g IV lento','Subir el goteo para prevenir la convulsión','Pedir el dosaje de magnesio y seguir igual','Dar un diurético y continuar'],[1,2,3],'Son signos de intoxicación por magnesio. No se miden niveles para decidir.','OPS 2024, cap. 1')]},

 Q('¿En cuánto tiempo hay que tratar la TA?',['Dentro de los primeros 15 minutos','Dentro de la primera hora','Después de confirmar con laboratorio','Tras una tercera toma a los 30 minutos'],[],'Con TA de 160/110 o más el tratamiento empieza dentro de los 15 minutos.','OPS 2024, cap. 1','Con PAS de 160 o PAD de 110 el margen es corto: el objetivo es prevenir el ACV.'),
 Q('¿Cuál es la meta de TA en la primera hora?',['PAS de 130 a 150 y PAD de 80 a 100','PAS de 110 a 120 y PAD de 70 a 80','PAS menor de 140 y PAD menor de 90','Bajar a la mitad la TA media en la hora'],[],'Un descenso brusco compromete la perfusión placentaria.','OPS 2024, cap. 1','Un descenso brusco compromete la perfusión placentaria. La meta es una franja, no lo más bajo posible.'),
 Q('Se dio labetalol 20 mg EV lento y a los 15 minutos la TA no bajó. ¿Qué sigue?',['Labetalol 40 mg EV lento, luego 80 mg a los 30 y 45 minutos, y nifedipina oral a los 60','Repetir labetalol 20 mg EV cada 5 minutos hasta que la TA baje de 140/90','Pasar a nifedipina 10 mg sublingual y repetirla a los 15 minutos si no baja','Esperar una hora antes de repetir el labetalol para no bajar la TA de golpe'],[1,2,3],'El esquema es minuto 0: 20 mg; minuto 15: 40 mg; minutos 30 y 45: 80 mg; minuto 60: se agrega nifedipina oral 10 a 20 mg. Siempre EV lento y con control de TA cada 5 minutos.','Algoritmo HTA/PE, Argentina','El esquema escalona la dosis cada 15 minutos y recién al final agrega otro fármaco por vía oral.')],
'3.3':[
 Q('¿Cómo se prepara y se pasa la dosis de ataque?',['5 g (4 ampollas al 25%) en 100 mL de fisiológica o Ringer, en 20 minutos','5 g (4 ampollas al 25%) en bolo EV directo, en 2 minutos','5 g (4 ampollas al 25%) en 500 mL de dextrosa, en 6 horas','4 g (2 ampollas al 25%) en 100 mL de fisiológica, en 20 minutos'],[1],'Cada ampolla de 5 mL al 25% tiene 1,25 g: 4 ampollas son 5 g.','Algoritmo HTA/PE, Argentina','Calculá cuántos gramos tiene una ampolla de 5 mL al 25% y pensá en el riesgo de pasarlo rápido.'),
 Q('¿Cómo se arma y se pasa el mantenimiento?',['24 g (19 ampollas) en 405 mL de dextrosa al 5%, a 1 g/h por bomba durante 24 horas','24 g (19 ampollas) en 405 mL de dextrosa al 5%, a 2 g/h hasta que baje la TA','12 g (10 ampollas) en 500 mL de fisiológica, a goteo libre durante 12 horas','24 g (19 ampollas) en 405 mL de dextrosa al 5%, solo mientras dura la cesárea'],[],'1 g/h equivale a unos 21 mL/h por bomba, o 7 gotas por minuto con macrogotero. En la eclampsia se mantiene al menos 48 horas.','Algoritmo HTA/PE, Argentina; OPS 2024, cap. 1','Fijate la dosis por hora, cómo se controla el goteo y hasta cuándo se mantiene.'),
 Q('A las 6 horas: reflejo patelar ausente, FR 10 y diuresis de 20 mL/h. ¿Qué se hace?',['Suspender la infusión, avisar y dar gluconato de calcio al 10%, 1 g IV lento','Bajar el goteo a la mitad y pedir un dosaje de magnesio','Mantener la infusión y dar un diurético para mejorar la diuresis','Suspender la infusión y esperar una hora para reevaluar los reflejos'],[1,2,3],'Son signos de intoxicación por magnesio. No se miden niveles para decidir.','OPS 2024, cap. 1','Reflejo ausente, FR baja y oliguria juntos. Pensá en el antídoto y en no esperar un dosaje.')],
'3.4':[
 Q('¿Qué muestra el cuadro?',['Sepsis con disfunción orgánica: PAM menor de 65','Infección de la herida sin compromiso sistémico','Respuesta inflamatoria normal del posoperatorio','Reacción adversa al antibiótico profiláctico'],[],'La hipotensión con PAM menor de 65 es disfunción orgánica.','OPS 2024, sepsis materna','Calculá la PAM con la TA del monitor y compará con el umbral de disfunción.'),
 Q('Después de 30 mL/kg la PAM sigue en 60. ¿Qué sigue?',['Noradrenalina con meta de PAM de 65 o más','Otro bolo de 30 mL/kg de cristaloides','Dopamina en dosis alta como primera elección','Hidrocortisona sola, sin vasopresor'],[],'Si no responde a la noradrenalina se agrega vasopresina, y se considera hidrocortisona.','OPS 2024, sepsis materna','Después de la carga de fluidos, si la PAM no sube hace falta un vasopresor. Pensá cuál es el de primera elección.'),
 Q('¿Qué se hace con el foco?',['Avisar para evaluación quirúrgica y control del foco, sin demorar el tratamiento','Esperar 48 horas de antibiótico antes de evaluar el foco','Curar la herida en la sala y tomar un cultivo de la secreción','Suspender el antibiótico hasta tener el resultado de los cultivos'],[1,3],'El control del foco es parte del tratamiento desde el inicio.','OPS 2024, sepsis materna','El antibiótico no alcanza si hay una colección. ¿Quién tiene que ver la herida y cuándo?')],
'4.1':[
 Q('¿Qué muestra la tendencia?',['Un sangrado sostenido, con índice de shock de 0,7 a 1,2','Una adaptación normal, con índice de shock de 0,7 a 0,9','Un sangrado que ya cede, con índice de shock en descenso','Una taquicardia por dolor, con TA todavía normal'],[],'Se calcula en cada toma: 84/118, 98/110 y 112/96.','OPS 2024, cap. 8','Calculá el índice de shock en cada toma y mirá hacia dónde va.'),
 Q('El útero está contraído. ¿Qué causa se sospecha?',['Trauma: sangrado de la episiotomía o de un desgarro','Tono: una atonía que todavía no se palpa','Tejido: restos placentarios retenidos','Ninguna: un útero contraído descarta la hemorragia'],[3],'El trauma explica cerca del 20% de las hemorragias posparto y sangra con el útero firme.','OPS 2024, cap. 8','El útero está firme en todas las tomas y hay un dato en el periné. Pensá en las 4 T.'),
 Q('¿Qué se hace?',['Avisar, activar la respuesta a la hemorragia y revisar el canal de parto para reparar','Seguir observando y controlar cada 15 minutos, porque el útero sigue contraído','Masaje uterino enérgico, una nueva dosis de oxitocina y reevaluar el tono','Cambiar los apósitos, pesarlos y repetir el control de la pérdida en una hora'],[1,3],'La sutura del desgarro es parte del escalamiento.','OPS 2024, cap. 8','Si la causa no es el tono, el tratamiento tampoco actúa sobre el útero.')],
'4.2':[
 Q('¿Qué muestra la tendencia?',['Plaquetas en descenso, transaminasas en ascenso y epigastralgia: síndrome HELLP','Una preeclampsia estable, con un laboratorio que varía dentro de lo esperado','Una gastritis por estrés de la internación, con laboratorio sin relevancia','Un hígado graso agudo del embarazo, por las transaminasas elevadas'],[],'Cada toma suma un dato de daño de órgano.','OPS 2024, cap. 1','Mirá juntas las tres tomas: qué pasa con las plaquetas, el hígado y los síntomas.'),
 Q('¿Por qué importa el dolor epigástrico?',['Es un criterio de severidad y un pródromo de eclampsia','Es un síntoma digestivo frecuente que no cambia la conducta','Indica reflujo y se controla con un antiácido','Solo importa si la TA supera 160/110'],[],'La epigastralgia refractaria es criterio de finalización inmediata.','OPS 2024, cap. 1','Pensá en qué órgano duele y en qué complicación puede anunciar.'),
 Q('¿Qué se hace?',['Avisar, sulfato de magnesio, control de TA y preparar la finalización con maduración pulmonar','Dar un antiácido, repetir el laboratorio en 12 horas y seguir controlando','Esperar a que la TA llegue a 160/110 para iniciar el tratamiento','Finalizar el embarazo de inmediato, sin estabilizar ni dar sulfato'],[1,2,3],'El síndrome HELLP es criterio de finalización. Antes de las 34 semanas se completa la maduración pulmonar si la situación materna lo permite.','OPS 2024, cap. 1','El HELLP es criterio de finalización, pero antes se estabiliza. Pensá también en la edad gestacional.')],
'4.3':[
 Q('¿Qué muestra la tendencia?',['Una intoxicación por magnesio que progresa','El efecto sedante esperable del magnesio','Una eclampsia en la fase postictal','Una depresión respiratoria por opioides'],[],'Se pierden el reflejo patelar, la frecuencia respiratoria y la diuresis en forma progresiva.','OPS 2024, cap. 1','Mirá qué pasa con el reflejo patelar, la FR y la diuresis en las tres tomas.'),
 Q('¿Qué dato favorece la acumulación?',['La caída de la diuresis, porque el magnesio se elimina por el riñón','El ritmo de 1 g/h, que es una dosis alta para su peso','La cesárea, que aumenta la absorción del magnesio','La TA en descenso, que concentra el magnesio en sangre'],[],'Con oliguria el magnesio se acumula aunque la dosis no cambie.','OPS 2024, cap. 1','Pensá por dónde se elimina el magnesio.'),
 Q('¿Qué se hace?',['Suspender, avisar, gluconato de calcio al 10% 1 g IV lento y soporte respiratorio','Bajar el goteo a 0,5 g/h y controlar los reflejos en una hora','Mantener la infusión hasta completar las 24 horas indicadas','Suspender y pedir un dosaje, esperando el resultado para el calcio'],[1,2,3],'Reflejo ausente, FR menor de 12 y diuresis menor de 30 mL/h obligan a suspender.','OPS 2024, cap. 1','Con los tres signos alterados no hay que esperar. Pensá en el antídoto.')],
'4.4':[
 Q('¿Qué muestra la tendencia?',['Una infección puerperal que evoluciona a sepsis con disfunción orgánica','Una fiebre por congestión mamaria, que cede con el amamantamiento','Una infección urinaria baja, sin compromiso sistémico','Una fiebre del posoperatorio, esperable en los primeros días'],[],'A las 20 se suman hipotensión, confusión y oliguria.','OPS 2024, sepsis materna','Mirá qué se agrega en la tercera toma: TA, sensorio y diuresis.'),
 Q('¿Qué foco es el más probable?',['Endometritis','Mastitis','Infección de la herida','Pielonefritis'],[],'Útero doloroso y loquios fétidos orientan al foco uterino.','OPS 2024, sepsis materna','El útero doloroso y el olor de los loquios señalan el órgano.'),
 Q('¿Qué se hace?',['Cultivos, lactato, antibiótico en la primera hora, cristaloides y aviso al equipo','Antitérmico, más líquidos por boca y control de temperatura a la mañana','Hemocultivos y esperar el resultado para elegir el antibiótico','Antibiótico oral y control de temperatura cada 6 horas'],[1,2,3],'Cada hora de demora en el antibiótico empeora el pronóstico.','OPS 2024, sepsis materna','Cada hora de demora en el antibiótico cuenta. Pensá qué se toma antes y qué no puede esperar.')],
'5.1':[
 Q('¿Qué dato se calcula primero?',['El índice de shock: 126 dividido 84 da 1,5','El índice de shock: 84 dividido 126 da 0,7','La PAM: con 84/50 da alrededor de 61','La diuresis de las últimas 2 horas'],[],'Con un índice de 1,4 o más la intervención es urgente.','OPS 2024, cap. 8','Elegí el dato rápido que resume la gravedad de una hemorragia con dos números del monitor.'),
 Q('¿Qué está pasando?',['Hemorragia posparto por atonía, con shock','Hipotensión por la anestesia raquídea','Sangrado de la herida quirúrgica','Reacción vasovagal por dolor'],[],'El apósito seco no descarta el sangrado: la pérdida sale por vía vaginal.','OPS 2024, cap. 8','El apósito está seco. Mirá el útero y los loquios.'),
 Q('¿Qué se hace primero?',['Pedir ayuda y activar el Código Rojo con un solo llamado','Ir a buscar al médico y volver con él a evaluarla','Hacer masaje uterino y controlar de nuevo en 15 minutos','Pasar un bolo de cristaloides y esperar la respuesta'],[1,2,3],'El Código Rojo se activa con un solo llamado, sin dejar sola a la paciente.','OPS 2024, cap. 8','Ante el shock, lo primero es que llegue el equipo sin dejar sola a la paciente.')],
'5.2':[
 Q('¿Qué grado de shock tiene?',['Severo: pérdida mayor del 35%','Moderado: del 26 al 35%','Leve: del 16 al 25%','Compensado: menos del 15%'],[],'FC mayor de 120, PAS menor de 70, letargia y llenado lento corresponden al shock severo.','OPS 2024, cap. 8','Ubicá FC, PAS, sensorio y llenado capilar en la tabla de grados de shock.'),
 Q('¿Qué conducta corresponde con la sangre?',['Dos unidades de glóbulos rojos 0 negativo de inmediato, sin esperar la hemoglobina','Esperar las pruebas cruzadas completas antes de transfundir','Transfundir recién si la hemoglobina baja de 7 g/dL','Seguir con cristaloides hasta completar 3 litros'],[1,3],'En el shock hemorrágico la sangre no espera al laboratorio.','OPS 2024, cap. 8','En el shock hemorrágico, ¿la sangre espera al laboratorio?'),
 Q('¿Qué se agrega para sostener la perfusión mientras llega el tratamiento definitivo?',['El traje antichoque no neumático','La posición de Trendelenburg extrema','Vasopresores como primera medida','Más cristaloides fríos en bolo rápido'],[2,3],'El traje antichoque no neumático es la primera estrategia en el shock y puede quedar hasta 48 horas.','OPS 2024, cap. 8','Pensá en una medida no farmacológica que sostiene la perfusión mientras llega el tratamiento definitivo.')],
'5.3':[
 Q('¿En qué proporción se transfunde?',['1:1:1 de glóbulos rojos, plasma y plaquetas','2:1:1 de glóbulos rojos, plasma y plaquetas','Solo glóbulos rojos hasta controlar el sangrado','1:1 de glóbulos rojos y plasma, sin plaquetas'],[],'El paquete de transfusión masiva sigue la proporción 1:1:1.','OPS 2024, cap. 8','Pensá en reponer todos los componentes que se pierden, y en qué proporción.'),
 Q('Con fibrinógeno de 150 mg/dL, ¿qué se indica?',['Crioprecipitado, porque está por debajo de 200','Nada todavía: recién por debajo de 100','Plasma fresco congelado solamente','Vitamina K endovenosa'],[],'El crioprecipitado se indica con fibrinógeno menor de 200 y es obligatorio por debajo de 100.','OPS 2024, cap. 8','Recordá el umbral de fibrinógeno en la hemorragia obstétrica y qué hemocomponente lo aporta.'),
 Q('Temperatura de 35,2 °C y calcio bajo. ¿Qué hace enfermería?',['Calentar fluidos y hemocomponentes, abrigar y reponer calcio según indicación','Suspender la transfusión hasta que la temperatura supere 36 °C','Seguir igual: la temperatura y el calcio no influyen en el sangrado','Pasar los hemocomponentes más rápido y sin calentador'],[1,2,3],'La hipotermia y la hipocalcemia empeoran la coagulopatía.','OPS 2024, cap. 8','La hipotermia y la hipocalcemia son parte del diamante de la muerte.')],
'5.4':[
 Q('¿Cuál es el paso siguiente?',['Balón hidrostático intrauterino, que puede quedar hasta 24 horas','Otra dosis de oxitocina y reevaluar el tono en 2 horas','Embolización arterial con la paciente todavía inestable','Histerectomía inmediata sin intentar otras medidas'],[1,2],'La embolización se reserva para pacientes estables.','OPS 2024, cap. 8','Con uterotónicos y masaje sin respuesta, el siguiente escalón es mecánico y se coloca en la sala de partos.'),
 Q('Si el balón no controla el sangrado, ¿qué sigue?',['Suturas compresivas tipo B-Lynch, ligaduras vasculares e histerectomía','Colocar un segundo balón y dejarlos inflados durante 48 horas más','Trasladarla a embolización arterial aunque siga hemodinámicamente inestable','Seguir con más uterotónicos hasta la dosis máxima antes de cualquier cirugía'],[],'El escalamiento quirúrgico termina en la histerectomía y la cirugía de control de daños.','OPS 2024, cap. 8','Si las medidas mecánicas fallan, el escalamiento pasa al quirófano.'),
 Q('¿Cuáles son las metas de la reanimación?',['Índice de shock menor de 0,9, temperatura mayor de 35 °C, lactato menor de 2 y fibrinógeno mayor de 200','TA mayor de 120/80 mmHg, hemoglobina mayor de 10 g/dL, FC menor de 80 y diuresis normal','Diuresis mayor de 2 mL/kg/h, temperatura mayor de 37 °C, FC menor de 60 y lactato normal','Que deje de sangrar y la TA se normalice, sin necesidad de otros controles de laboratorio'],[],'Las metas se controlan en conjunto, no con un único dato. Además, SpO2 de 95% o más.','OPS 2024, cap. 8','Las metas se miran en conjunto: perfusión, temperatura, metabolismo y coagulación.')],
'5.5':[
 Q('¿Qué herramienta ordena el pase a terapia intensiva?',['SBAR: situación, antecedentes, valoración y recomendación','Un resumen libre de lo ocurrido, sin un orden fijo','La lectura de la historia clínica por el equipo que recibe','El parte escrito de enfermería al final del turno'],[],'La comunicación estructurada evita omisiones en el pase.','OPS 2024, cap. 9','Es una herramienta estructurada de cuatro partes.'),
 Q('¿Para qué se notifica el evento?',['Para analizar las causas del sistema y evitar que se repita, sin buscar culpables','Para identificar a la persona responsable y tomar medidas con ella','Para cumplir con un requisito administrativo del servicio','Para dejar constancia ante un posible reclamo legal'],[],'La notificación alimenta la mejora de los procesos.','OPS 2024','Pensá en la cultura de seguridad del paciente.'),
 Q('¿Qué controles necesita en las primeras horas?',['Signos vitales, pérdidas, diuresis horaria, temperatura y laboratorio seriado','Signos vitales cada 12 horas, si se mantiene estable','Retirar el balón y las vías para favorecer la movilización','Solo la temperatura y el dolor, porque ya está en terapia'],[1,2],'El balón puede quedar hasta 24 horas y el sangrado puede reaparecer.','OPS 2024, cap. 8','El sangrado puede reaparecer en las primeras horas. ¿Qué datos lo anticipan?')]

/* Monitor multiparamétrico. m.v trae los valores; m.alt los que están fuera de rango (la segunda mirada los marca). */
function monSVG(m,hint){
 const v=m.v||{},alt=m.alt||[];
 const P=[['FC','FC','lpm','#5ee08a'],['TA','TA','mmHg','#ff8a8a'],['SpO2','SpO2','%','#5fd3f0'],['FR','FR','rpm','#f5d06b'],['T','T','°C','#e9e2e4']];
 let s='<rect x="0" y="0" width="340" height="230" rx="14" fill="#0b0f12"/>';
 s+='<path d="M14 40 h40 l6 -4 l5 4 h10 l4 10 l6 -34 l6 40 l4 -12 h12 l8 -6 l8 6 h44 l6 -4 l5 4 h10 l4 10 l6 -34 l6 40 l4 -12 h12 l8 -6 l8 6 h44" fill="none" stroke="#5ee08a" stroke-width="2.2" stroke-linejoin="round"/>';
 P.forEach((p,i)=>{
  const col=i%2,row=Math.floor(i/2),x=12+col*162,y=66+row*54,w=i===4?316:154;
  const on=hint&&alt.includes(p[0]);
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="48" rx="8" fill="#141a1f" stroke="'+(on?'#ffb020':'#222b31')+'" stroke-width="'+(on?3:1)+'"/>';
  s+='<text x="'+(x+10)+'" y="'+(y+18)+'" fill="'+p[3]+'" font-size="13" font-weight="700">'+p[1]+'</text>';
  s+='<text x="'+(x+10)+'" y="'+(y+40)+'" fill="#8d979c" font-size="11">'+p[2]+'</text>';
  s+='<text x="'+(x+w-10)+'" y="'+(y+38)+'" fill="'+p[3]+'" font-size="28" font-weight="700" text-anchor="end">'+esc(v[p[0]]||'--')+'</text>';
  if(on)s+='<text x="'+(x+w-10)+'" y="'+(y+14)+'" fill="#ffb020" font-size="11" font-weight="700" text-anchor="end">fuera de rango</text>';
 });
 return SV('0 0 340 230',s,'Monitor: '+P.map(p=>p[1]+' '+(v[p[0]]||'sin dato')).join(', '));
}
/* Útero palpado sobre el abdomen. tone 0: blando y alto; tone 1: contraído y bajo el ombligo. */

 s+='<circle cx="170" cy="112" r="6" fill="none" stroke="#d9b8c2" stroke-width="2.5"/>';
 if(soft)s+='<path d="M110 205 C95 140 110 70 170 62 C230 70 245 140 230 205 Z" fill="#c04a6a55" stroke="#ff9db5" stroke-width="3" stroke-dasharray="7 6"/>';
 else s+='<path d="M130 205 C122 175 132 140 170 136 C208 140 218 175 210 205 Z" fill="#c04a6a99" stroke="#ff9db5" stroke-width="3.5"/>';
 s+='<path d="M'+(soft?150:155)+' '+(soft?58:132)+' q15 -12 30 0" fill="none" stroke="#f5d06b" stroke-width="2.5"/>';
 s+='<text x="170" y="'+(soft?52:126)+'" fill="#f5d06b" font-size="12" text-anchor="middle">mano en el fondo</text>';

  s+='<text x="182" y="116" fill="#ffb020" font-size="13" font-weight="700">ombligo</text>';
  s+='<text x="170" y="232" fill="#ffb020" font-size="13" font-weight="700" text-anchor="middle">sínfisis del pubis</text>';
  s+='<text x="12" y="22" fill="#ffb020" font-size="13" font-weight="700">'+(soft?'Fondo blando, sobre el ombligo':'Fondo firme, bajo el ombligo')+'</text>';

/* Bolsa colectora calibrada. */
function bagSVG(m,hint){
 const ml=m.ml||0,top=30,bot=210,max=2000,y=bot-(bot-top)*Math.min(ml,max)/max;
 let s='<path d="M110 20 h120 l-6 196 q-54 18 -108 0 Z" fill="#1d1418" stroke="#d9b8c2" stroke-width="2"/>';
 s+='<clipPath id="bgc"><path d="M110 20 h120 l-6 196 q-54 18 -108 0 Z"/></clipPath>';
 s+='<rect x="100" y="'+y+'" width="140" height="'+(bot-y+30)+'" fill="#a3203f" clip-path="url(#bgc)"/>';
 for(let v=250;v<=max;v+=250){const yy=bot-(bot-top)*v/max;s+='<line x1="230" y1="'+yy+'" x2="'+(v%500?242:250)+'" y2="'+yy+'" stroke="#d9b8c2" stroke-width="2"/>'+(v%500?'':'<text x="256" y="'+(yy+4)+'" fill="#d9b8c2" font-size="12">'+v+' mL</text>')}
 if(hint){const yu=bot-(bot-top)*500/max;s+='<line x1="96" y1="'+yu+'" x2="244" y2="'+yu+'" stroke="#ffb020" stroke-width="2.5" stroke-dasharray="6 4"/><text x="92" y="'+(yu+4)+'" fill="#ffb020" font-size="12" font-weight="700" text-anchor="end">umbral 500 mL</text><text x="170" y="'+(y-8)+'" fill="#ffb020" font-size="14" font-weight="700" text-anchor="middle">'+ml+' mL</text>'}
 return SV('0 0 340 240',s,'Bolsa colectora calibrada con '+ml+' mL');
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const ver=s=>esc(s).replace(/\[VERIFICAR[^\]]*\]/g,m=>'<span class="ver">'+m+'</span>');

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function resume(){stop();if(!S.code){S.code=rand4();save()}S.evd=S.evd||{};
 if(S.lv>=5){evalScreen('post');return}

function levelIntro(){
 stop();ensureHost();const k=S.lv,L=LV[k],n=S.plan[k].length,mx=n*60*(S.half?.5:1),min=Math.ceil(.6*mx);
 wait('Nivel '+(k+1)+'. '+L.n+'. El coordinador está por empezar.');

 +(S.half?'<div class="fb warn"><strong>Reanimación del equipo</strong>En este nivel hay 3 vidas y la mitad del puntaje.</div>':'')
 +(ROOM&&S.code?'<div class="card"><h3>Sala en vivo</h3><p class="muted">Para que el resto siga el caso en su celular: abren este mismo enlace, eligen Ver el caso en mi celular y escriben el código. Solo quien coordina responde.</p><div class="big" style="letter-spacing:6px">'+S.code.toUpperCase()+'</div></div>':'')
 +'<div class="hud" style="position:static;border:0"><span class="hearts" aria-label="'+S.lives+' vidas">'+hearts()+'</span><span><b>'+S.score+'</b> puntos</span></div>'
 +'<button class="btn" id="go">'+(S.ri?'Seguir en la ronda '+(S.ri+1):'Empezar nivel')+'</button><button class="btn sec" id="hm">Salir al inicio</button>');
 $('go').onclick=startRound;$('hm').onclick=home;

/* ---------- Ronda ---------- */
function startRound(){
 stop();ensureHost();
 const c=CASES.find(x=>x.id===S.plan[S.lv][S.ri]),t=LV[S.lv].t+(c.ck?CK_EXTRA:0);
 R={c,qi:0,tk:0,tot:t,left:t,err:0,freeze:0,hint:false,hid:[],ans:null,perm:shuffle([0,1,2,3]),k:{m:[],d:false,o:false},msg:null,timed:false,sbar:[0,0,0,0],closing:false,last:Date.now(),pts:0,head:''};
 S.rc++;save();
 R.timer=setInterval(tick,250);
 drawRound(true);
}
function tick(){
 if(!R||R.closing)return;
 const n=Date.now(),dt=(n-R.last)/1000;R.last=n;
 if(R.ans===null){if(R.freeze>0)R.freeze=Math.max(0,R.freeze-dt);else R.left-=dt}
 const e=$('tm');
 if(e){e.textContent=(R.freeze>0?'Pausa ':'')+mmss(R.freeze>0?R.freeze:R.left);e.classList.toggle('low',R.freeze===0&&R.left<20)}
 if(R.left<=0){R.timed=true;R.left=0;closeRound()}
}
function rolesHTML(nm,rc){
 nm=nm||S.names;rc=rc==null?S.rc:rc;
 const n=nm.length,r=['Lee el caso','Valora','Observa el checklist','Comunica con SBAR'];
 if(n<2)return '<div class="muted">Roles de la ronda: lee, valora, observa el checklist y comunica.</div>';
 return '<div class="roles">'+r.map((x,j)=>'<span>'+x+'</span><b>'+esc(nm[(rc+j)%n])+'</b>').join('')+'</div>';
}
function hudHTML(){
 return '<div class="hud"><div><b>Nivel '+(S.lv+1)+'</b><div class="muted">Ronda '+(S.ri+1)+' de '+S.plan[S.lv].length+'</div></div>'
 +'<div style="text-align:center"><div class="tm" id="tm">'+mmss(R.freeze>0?R.freeze:R.left)+'</div>'+(S.code&&ROOM?'<div class="muted">Sala '+S.code.toUpperCase()+', <span id="wc">'+watchers()+'</span> viendo</div>':'')+'</div>'
 +'<div style="text-align:right"><div class="hearts" aria-label="'+S.lives+' vidas">'+hearts()+'</div><div class="muted"><b>'+S.score+'</b> puntos'+(S.shield?', escudo activo':'')+'</div></div></div>';
}
function drawRound(sc){
 if(!R)return;
 const c=R.c,q=c.q[R.qi],cv=caseView(c,R.tk,R.hint),img=cv.img,rows=cv.rows,done=R.ans!==null;
 let h=hudHTML()+'<h2 style="margin-top:12px">'+c.id+' '+esc(c.t)+'</h2>'+rolesHTML()+'<p>'+esc(c.ctx)+'</p>'+imgHTML(img);
 if(c.tomas)h+='<div class="chips">'+c.tomas.map((t,i)=>'<button class="chip" data-t="'+i+'" aria-pressed="'+(i===R.tk)+'">Toma '+(i+1)+', '+t.h+'</button>').join('')+'</div>';
 h+=tableHTML(rows);
 h+=obsHTML(c,R.k,'host',obsWho(S.names,S.rc));
 h+='<div id="msg">'+(R.msg?'<div class="fb '+R.msg[0]+'">'+esc(R.msg[1])+'</div>':'')+'</div>';
 h+='<div class="card"><div class="qn">Pregunta '+(R.qi+1)+' de 3, '+QL[R.qi]+'</div><h3>'+esc(q.q)+'</h3>';
 R.perm.forEach(i=>{
  let cl='opt';if(done){if(i===0)cl+=' ok';else if(i===R.ans)cl+=' bad'}
  h+='<button class="'+cl+'" type="button" data-i="'+i+'"'+(R.hid.includes(i)?' hidden':'')+(done?' disabled':'')+'>'+esc(q.o[i])+'</button>';
 });
 h+='<p class="muted" id="tly" aria-live="polite"></p></div>';
 if(done){
  const ok=R.ans===0;
  h+='<div class="fb '+(ok?'ok':'bad')+'"><strong>'+esc(R.head)+'</strong>'+(ok?'':'Respuesta correcta: <b>'+esc(q.o[0])+'</b>.<br>')+ver(q.w)+'<div class="src">Fuente: '+ver(q.s)+'</div></div>'
  +'<button class="btn" id="nx">'+(S.lives<=0?'Continuar':(R.qi>=2?'Cerrar la ronda':'Siguiente pregunta'))+'</button>';
 } else if(S.cards.length){
  h+='<h3>Tarjetas de ayuda</h3><div class="cards">'+S.cards.map(k=>{
   const cd=CARDS.find(x=>x.k===k);
   const dis=(k==='segunda'&&(R.hint||!cv.canHint))||(k==='pausa'&&R.freeze>0)||(k==='consulta'&&R.hid.length>0)||(k==='escudo'&&S.shield);
   return '<button class="cbtn" data-c="'+k+'"'+(dis?' disabled':'')+'><b>'+cd.n+'</b><small>'+cd.d+'</small></button>';
  }).join('')+'</div>';
 }
 put(h,sc===true);
 on('[data-i]',b=>b.onclick=()=>answer(+b.dataset.i));
 on('[data-t]',b=>b.onclick=()=>{R.tk=+b.dataset.t;drawRound(false)});
 on('[data-c]',b=>b.onclick=()=>useCard(b.dataset.c));
 obsBind(c,R.k,'host',obsConfirm);
 if($('nx'))$('nx').onclick=nextQ;
 sync();updLive();
}
function answer(i){
 if(!R||R.ans!==null||R.closing)return;
 const q=R.c.q[R.qi],h=S.half?.5:1,pts=[10,20,30][R.qi]*h;
 R.ans=i;
 if(i===0){R.pts+=pts;S.score+=pts;S.lvBase+=pts;S.lvScore+=pts;R.head='Correcto, suman '+pts+' puntos.'}
 else{
  R.err++;
  const crit=q.c.includes(i);
  S.review.push({lv:S.lv,ctx:R.c.id+' '+R.c.t,q:q.q,got:q.o[i],ok:q.o[0],why:q.w,src:q.s,crit});
  if(crit){if(S.shield){S.shield=false;R.head='Error crítico. El escudo evitó perder una vida.'}else{S.lives--;R.head='Error crítico, pierden una vida.'}}
  else R.head='Respuesta incorrecta, no suman puntos.';
 }
 save();drawRound(false);
}
function nextQ(){
 recTally();
 if(S.lives<=0){stop();R=null;rescue();return}
 R.qi++;
 if(R.qi>=3){closeRound();return}
 R.ans=null;R.hid=[];R.perm=shuffle([0,1,2,3]);R.msg=null;R.last=Date.now();
 drawRound(true);
}
function useCard(k){
 const idx=S.cards.indexOf(k);if(idx<0||R.ans!==null)return;
 if(k==='segunda'){R.hint=true;R.left+=30}
 else if(k==='pausa'){R.freeze=60}
 else if(k==='consulta'){R.hid=shuffle([1,2,3]).slice(0,2)}
 else if(k==='escudo'){S.shield=true;R.msg=['ok','Escudo activo: absorbe el próximo error crítico.']}
 S.cards.splice(idx,1);save();drawRound(false);
}
function obsConfirm(){
 if(!R||R.closing||!R.c.ck||R.k.d)return;
 R.k.m=ST[R.c.ck.e].it.map((x,i)=>R.k.m[i]||0);
 const e=ckEval(R.c,R.k.m),h=S.half?.5:1,pts=CK_PTS*h*e.hit,asked=R.k.m.some(x=>x===2);
 R.k.d=true;R.k.o=true;
 S.score+=pts;S.lvScore+=pts;
 if(e.fa)R.left=Math.max(1,R.left-CK_SEG*e.fa);
 let t=e.hit?'Pausa justificada: '+e.hit+' de '+e.nf+(e.nf===1?' falla detectada':' fallas detectadas')+', suman '+pts+' puntos.':asked?'La pausa no encontró ninguna falla real.':'Checklist confirmado sin pausa.';
 if(e.miss)t+=e.miss===1?' Quedó 1 falla sin detectar.':' Quedaron '+e.miss+' fallas sin detectar.';
 if(e.fa)t+=(e.fa===1?' Hubo 1 falsa alarma':' Hubo '+e.fa+' falsas alarmas')+': se descuentan '+(CK_SEG*e.fa)+' segundos.';
 R.msg=[e.hit&&!e.miss&&!e.fa?'ok':(e.nf===0&&!e.fa?'ok':'warn'),t];
 save();drawRound(false);
}

 +'<tr><td>Bonus de rapidez</td><td>'+(R.speed?'+10':'No suma ('+(R.err?'hubo errores':'pasó la mitad del tiempo')+')')+'</td></tr></table></div>';
 h+='<h3>SBAR de quien comunica</h3><p class="muted">Tocá cada parte que el mensaje cubrió. Con las cuatro, suma 10 puntos.'+(c.sbar?' En este evento es obligatorio.':'')+'</p><div class="chips">'
 +names.map((n,i)=>'<button class="chip" data-s="'+i+'" aria-pressed="'+(R.sbar[i]?'true':'false')+'">'+n+'</button>').join('')+'</div>';
 if(R.err===0&&!R.timed&&S.lv>=3&&S.lives<5)h+='<div class="fb ok"><strong>Ronda sin errores</strong>Recuperan una vida.</div>';
 h+='<button class="btn" id="cont"'+(c.sbar&&!ok4?' disabled':'')+'>Continuar</button>';
 wait('Cierre de la ronda '+c.id+'. El coordinador suma los puntos.');
 put(hudHTML().replace(/id="tm"/,'')+h);
 on('[data-s]',b=>b.onclick=()=>{R.sbar[+b.dataset.s]=R.sbar[+b.dataset.s]?0:1;drawClose();});

function finishRound(){
 const h=S.half?.5:1;let add=0;
 if(R.speed)add+=10;
 if(R.sbar.every(Boolean))add+=10;
 add*=h;S.score+=add;S.lvScore+=add;
 if(R.err===0&&!R.timed&&S.lv>=3&&S.lives<5)S.lives++;
 S.ri++;R=null;save();
 if(S.ri>=S.plan[S.lv].length)levelEnd();else startRound();
}
function levelEnd(){
 const k=S.lv,n=S.plan[k].length,mx=n*60*(S.half?.5:1),min=Math.ceil(.6*mx),pass=S.lvBase>=min;
 let coop=true;
 wait('Nivel '+(k+1)+(pass?' superado.':' sin superar.'));
 const draw=()=>{
  put('<h2>Nivel '+(k+1)+' '+(pass?'superado':'sin superar')+'</h2>'
  +'<div class="card"><table class="t"><tr><td>Puntos de las preguntas</td><td><b>'+S.lvBase+'</b> de '+mx+'</td></tr><tr><td>Mínimo para avanzar</td><td>'+min+'</td></tr><tr><td>Puntaje total</td><td>'+S.score+'</td></tr></table></div>'
  +(pass?'<div class="badge">'+badgeSVG(k+1,true)+'<div><b>Insignia: '+LV[k].b+'</b>'+(k<4?'<div class="muted">Tarjeta de ayuda: '+CARDS[k].n+'</div>':'')+'</div></div>'
  +'<p>Cooperación: si todas las personas ocuparon algún rol, el equipo suma 50 puntos.</p><div class="chips"><button class="chip" id="cp" aria-pressed="'+coop+'">Todas participaron</button></div>'
  :'<div class="fb warn"><strong>Hace falta repetir el nivel</strong>No se llegó al 60% del puntaje de las preguntas. Se repite el nivel y se conservan las vidas.</div>')
  +'<button class="btn" id="nx">'+(pass?(k<4?'Siguiente nivel':'Ir al debriefing'):'Repetir el nivel')+'</button>');
  if($('cp'))$('cp').onclick=()=>{coop=!coop;draw()};
  $('nx').onclick=()=>{

   }else{S.score-=S.lvScore;S.lvScore=0;S.lvBase=0;S.ri=0;save();levelIntro()}
  };
 };

}

/* ---------- Respuestas desde los celulares: conteo para quien coordina ---------- */
let EVPH=null;
const FPR={f:1,id:'',nm:'',ak:'',a:-1,ev:null};
try{FPR.id=localStorage.getItem('eoe-pid')||'';FPR.nm=localStorage.getItem('eoe-nm')||''}catch(e){}
if(!/^[a-z0-9]{10}$/.test(FPR.id)){FPR.id=rndId(10);try{localStorage.setItem('eoe-pid',FPR.id)}catch(e){}}
function fsend(){if(ROOMC&&MODE==='follow'){try{ROOMC.presence(Object.assign({},FPR)).catch(()=>{})}catch(e){}}}
const players=()=>ROOMC?ROOMC.peers().filter(p=>!p.isMe&&p.presence&&p.presence.f===1):[];
const roundKey=()=>R?R.c.id+'|'+S.rc+'|'+R.qi:'';
function tallyFor(k){let n=0,ok=0;players().forEach(p=>{if(p.presence.ak===k&&p.presence.a>=0){n++;if(p.presence.a===0)ok++}});return{n,ok}}
function tallyTxt(){
 if(!ROOMC||!R)return'';
 const t=tallyFor(roundKey()),w=watchers();
 if(!w&&!t.n)return'';
 return 'Respondieron en sus celulares: <b>'+t.n+'</b>'+(w?' de '+w:'')+'.'+(R.ans!==null?' Acertaron: <b>'+t.ok+'</b>.':' Los aciertos se ven cuando el equipo marca su respuesta.');
}
function recTally(){
 if(!R||R.qi>2)return;
 const k=roundKey(),t=tallyFor(k);
 if(t.n){S.tal=S.tal||{};S.tal[k]={n:t.n,ok:t.ok,q:R.c.q[R.qi].q,c:R.c.id+' '+R.c.t};save()}

function talSummary(tal){

 let n=0,ok=0;a.forEach(x=>{n+=x.n;ok+=x.ok});
 const low=a.slice().sort((x,y)=>x.ok/x.n-y.ok/y.n).slice(0,3).filter(x=>x.ok<x.n);

}

/* ---------- Evaluación inicial y final ---------- */
const evN=a=>EV.reduce((s,q,i)=>s+(a&&a[i]===0?1:0),0);

 +(ROOM&&S.code?'<div class="card"><h3>Código de la sala</h3><p class="muted">Abren este mismo enlace, eligen Ver el caso en mi celular, escriben el código y su nombre.</p><div class="big" style="letter-spacing:6px">'+S.code.toUpperCase()+'</div></div>'
  +'<div class="card"><h3>Respondieron</h3><div id="evl"></div></div>'
  +'<button class="btn" id="evc">'+(pre?'Cerrar la evaluación y empezar el nivel 1':'Cerrar la evaluación y ver los resultados')+'</button>'
 :'<div class="fb warn"><strong>Hace falta la sala en vivo</strong>La evaluación se responde desde los celulares y solo funciona con el enlace publicado del juego.</div>')
 +'<button class="btn sec" id="evs">Saltear la evaluación</button>');
 evMerge();evList();
 const end=()=>{EVPH=null;S.evd[ph]=1;
  if(pre){save();levelIntro()}else{S.done=true;save();histSave();evalResults(S,true)}};
 if($('evc'))$('evc').onclick=end;
 $('evs').onclick=()=>{if(!pre)S.ev=false;end()};
}
/* Tabla de resultados: por persona y por pregunta. Se usa al final de la partida y en el historial. */
function evRows(ev){
 const ids=Array.from(new Set(Object.keys(ev.pre||{}).concat(Object.keys(ev.post||{}))));
 return ids.map(id=>{const a=(ev.pre||{})[id],b=(ev.post||{})[id];return{nm:(b&&b.nm)||(a&&a.nm)||'Sin nombre',a:a?a.a:null,b:b?b.a:null}});
}
function evalHTML(d){
 const ev=d.evr||{pre:{},post:{}},rows=evRows(ev),N=EV.length;
 let h='';
 if(rows.length){
  h+='<div class="card"><h3>Evaluación por persona</h3><table class="t"><tr><td><b>Nombre</b></td><td><b>Inicial y final</b></td></tr>'
  +rows.map(r=>'<tr><td>'+esc(r.nm)+'</td><td>'+(r.a?evN(r.a)+' de '+N:'sin dato')+', '+(r.b?evN(r.b)+' de '+N:'sin dato')+'</td></tr>').join('')+'</table>';
  const pct=(ph,i)=>{const v=Object.values(ev[ph]||{}).filter(x=>x.a[i]>=0);return v.length?Math.round(100*v.filter(x=>x.a[i]===0).length/v.length)+'%':'sin dato'};
  h+='<h3 class="sct">Aciertos por pregunta, inicial y final</h3><table class="t">'+EV.map((q,i)=>'<tr><td>'+(i+1)+'. '+esc(q.q)+'</td><td>'+pct('pre',i)+', '+pct('post',i)+'</td></tr>').join('')+'</table></div>';
 }else h+='<p class="muted">No hay respuestas de la evaluación en esta partida.</p>';
 const ts=talSummary(d.tal);
 if(ts){
  h+='<div class="card"><h3>Respuestas en los celulares durante el juego</h3><p>'+ts.n+' respuestas, '+ts.ok+' correctas ('+Math.round(100*ts.ok/ts.n)+'%).</p>'
  +(ts.low.length?'<p class="muted">Las preguntas con menos aciertos:</p><ul>'+ts.low.map(x=>'<li>'+esc(x.c)+': '+esc(x.q)+' <b>'+x.ok+' de '+x.n+'</b></li>').join('')+'</ul>':'')+'</div>';
 }
 return h;
}
function csvOf(d){
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"',N=EV.length,L=[];
 L.push(['Fecha',q(d.d||new Date().toLocaleDateString('es-AR'))].join(';'));
 L.push(['Equipo',q((d.names||[]).join(', '))].join(';'));
 L.push(['Puntaje del equipo',d.score].join(';'));L.push('');
 L.push(['Nombre','Inicial','Final'].concat(EV.map((x,i)=>'P'+(i+1)+' inicial'),EV.map((x,i)=>'P'+(i+1)+' final')).join(';'));
 const ok=(a,i)=>!a?'':a[i]===0?'1':a[i]>=0?'0':'';
 evRows(d.evr||{}).forEach(r=>L.push([q(r.nm),r.a?evN(r.a):'',r.b?evN(r.b):''].concat(EV.map((x,i)=>ok(r.a,i)),EV.map((x,i)=>ok(r.b,i))).join(';')));
 L.push('');L.push(['Caso','Pregunta','Respondieron','Acertaron'].join(';'));
 Object.values(d.tal||{}).forEach(x=>L.push([q(x.c),q(x.q),x.n,x.ok].join(';')));
 return '﻿'+L.join('\r\n');
}
function csvSave(d){
 try{const b=new Blob([csvOf(d)],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='resultados-emergencias-obstetricas-'+(d.code||'sala')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}
}
function histGet(){try{return JSON.parse(localStorage.getItem('eoe-hist')||'[]')||[]}catch(e){return[]}}
function histSave(){
 const h=histGet().filter(x=>x.code!==S.code||x.t0!==S.t0);
 h.unshift({d:new Date().toLocaleDateString('es-AR'),code:S.code,t0:S.t0||0,names:S.names,score:S.score,evr:S.evr||null,tal:S.tal||null});
 try{localStorage.setItem('eoe-hist',JSON.stringify(h.slice(0,30)))}catch(e){}
}
function evalResults(d,live){
 if(live)wait('Resultados de la evaluación.');
 put('<h2>Resultados'+(live?'':' del '+esc(d.d||''))+'</h2>'+(live?'':'<p class="muted">Equipo: '+esc((d.names||[]).join(', ')||'sin nombres')+'. Puntaje: '+d.score+'.</p>')
 +evalHTML(d)
 +(window.claude?'':'<button class="btn sec" id="csv">Descargar los resultados (CSV)</button>')
 +(live?'<button class="btn" id="db">Ir al debriefing</button>':'<button class="btn" id="bk">Volver</button>'));
 if($('csv'))$('csv').onclick=()=>csvSave(d);
 if(live)$('db').onclick=debrief;else $('bk').onclick=histView;
}
function histView(){
 const h=histGet();
 put('<h2>Resultados de sesiones anteriores</h2><p class="muted">Se guardan solo en este celular. Las partidas se guardan al terminar.</p>'
 +(h.length?h.map((x,i)=>'<button class="btn sec" data-h="'+i+'">'+esc(x.d)+', sala '+esc(String(x.code||'').toUpperCase())+', '+x.score+' puntos</button>').join(''):'<p>Todavía no hay sesiones terminadas.</p>')
 +'<button class="btn" id="bk">Volver</button>');
 on('[data-h]',b=>b.onclick=()=>evalResults(h[+b.dataset.h],false));
 $('bk').onclick=home;
}
/* Pantalla del jugador durante la evaluación: sin devolución. */
const FEV={pre:null,post:null};let FEVP=null;
function drawFollowEval(s){
 const ph=s.ph==='post'?'post':'pre';
 if(!FEV[ph])FEV[ph]=EV.map(()=>-1);
 if(!FEVP)FEVP=EV.map(()=>shuffle([0,1,2,3]));
 const a=FEV[ph],n=evDone(a);
 let h='<h2>Evaluación '+(ph==='pre'?'inicial':'final')+'</h2><p class="muted">Sala '+esc(FOLLOW.toUpperCase())+'. Respondé solo, sin consultar. No vas a ver si acertaste: sirve para comparar el antes y el después del grupo.</p>'
 +'<div class="card"><h3>Tu nombre</h3><input type="text" id="fnm" maxlength="40" autocomplete="off" placeholder="Nombre y apellido" value="'+esc(FPR.nm)+'" aria-label="Tu nombre"></div>';
 EV.forEach((q,i)=>{h+='<div class="card"><div class="qn">Pregunta '+(i+1)+' de '+EV.length+'</div><h3>'+esc(q.q)+'</h3>'
  +FEVP[i].map(j=>'<button class="opt'+(a[i]===j?' mine':'')+'" type="button" data-eq="'+i+'" data-eo="'+j+'" aria-pressed="'+(a[i]===j)+'">'+esc(q.o[j])+'</button>').join('')+'</div>'});
 h+='<div class="fb '+(n===EV.length?'ok':'warn')+'" id="fst">'+(n===EV.length?'<strong>Listo</strong>Tus respuestas ya le llegan a quien coordina. Podés cambiar alguna hasta que cierre la evaluación.':'Respondiste '+n+' de '+EV.length+'.')+'</div>'
 +'<button class="btn sec" id="fx">Salir de la sala</button>';
 put(h,false);$('fx').onclick=leaveFollow;
 const send=()=>{FPR.ev={c:FOLLOW,ph,a:a.slice()};fsend()};
 $('fnm').onchange=()=>{FPR.nm=$('fnm').value.trim().slice(0,40);try{localStorage.setItem('eoe-nm',FPR.nm)}catch(e){}send()};
 on('[data-eq]',b=>b.onclick=()=>{const i=+b.dataset.eq;a[i]=+b.dataset.eo;
  on('[data-eq="'+i+'"]',x=>{const m=+x.dataset.eo===a[i];x.classList.toggle('mine',m);x.setAttribute('aria-pressed',m)});
  const k=evDone(a),f=$('fst');f.className='fb '+(k===EV.length?'ok':'warn');f.innerHTML=k===EV.length?'<strong>Listo</strong>Tus respuestas ya le llegan a quien coordina. Podés cambiar alguna hasta que cierre la evaluación.':'Respondiste '+k+' de '+EV.length+'.';
  send()});
 send();
}
/* ---------- Modo espejo: ver el caso en mi celular ---------- */
function viewerPick(){
 stop();MODE=null;clearInterval(FT);FT=null;
 let last='';try{last=localStorage.getItem('eoe-follow')||''}catch(e){}
 put('<h2>Ver el caso en mi celular</h2>'
 +(ROOM?'<div class="card"><h3>Seguir la partida en vivo</h3><p class="muted">Quien coordina responde. Vos ves el mismo caso y las imágenes en tu pantalla. Pedile el código de la sala.</p>'
 +'<input type="text" id="cd" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="Código, por ejemplo K7M2" value="'+esc(last.toUpperCase())+'" aria-label="Código de la sala"><div id="fm"></div>'
 +'<button class="btn" id="fj">Unirme a la partida</button></div>'
 +'<p>O elegí a mano el nivel y la ronda.</p>'
 :'<p>Quien coordina dice en voz alta el número del caso que aparece en su pantalla, por ejemplo 2.3. Tocá ese mismo caso en la lista para verlo en tu celular.</p>')
 +LV.map((l,k)=>'<h3>Nivel '+(k+1)+'. '+l.n+'</h3>'+CASES.filter(c=>c.lv===k).map(c=>'<button class="btn sec sm" data-id="'+c.id+'">'+c.id+' '+esc(c.t)+'</button>').join('')).join('')
 +'<button class="btn" id="bk">Volver</button>');
 on('[data-id]',b=>b.onclick=()=>viewerShow(b.dataset.id));
 if($('fj'))$('fj').onclick=followStart;$('bk').onclick=home;
}
async function followStart(){
 const code=($('cd').value||'').toLowerCase().replace(/[^a-z0-9]/g,''),fm=$('fm');
 if(code.length<4){fm.innerHTML='<div class="fb warn">Escribí el código de 4 caracteres.</div>';return}
 if(!ROOM){fm.innerHTML='<div class="fb warn">La sala en vivo no está disponible en este momento. Podés elegir el caso a mano más abajo.</div>';return}
 fm.innerHTML='<p class="muted">Conectando...</p>';
 const r=await joinCode(code);
 if(!r){fm.innerHTML='<div class="fb warn">No se pudo entrar a la sala. Revisá el código e intentá de nuevo.</div>';return}
 try{localStorage.setItem('eoe-follow',code)}catch(e){}
 MODE='follow';FOLLOW=code;lastPres=null;FP=null;
 if(UNS)UNS();
 UNS=r.onPeers(()=>drawFollow());
 clearInterval(FT);FT=setInterval(ftick,500);
 drawFollow();
}
function leaveFollow(){
 clearInterval(FT);FT=null;if(UNS){UNS();UNS=null}
 MODE=null;FP=null;lastPres=null;
 const r=ROOMC;ROOMC=null;if(r){try{r.leave()}catch(e){}}
 viewerPick();
}
function hostPeer(){let b=null;if(ROOMC)ROOMC.peers().forEach(p=>{if(p.presence&&p.presence.host===1&&!p.isMe&&(!b||p.updatedAt>b.updatedAt))b=p});return b}
function ftick(){
 if(MODE!=='follow'||!FP)return;
 const s=FP.presence;if(s.scr!=='round')return;
 const el=(Date.now()-FP.updatedAt)/1000;let t,pa='';
 if(s.a>=0)t=s.left;else if(s.fr>0){const f=s.fr-el;if(f>0){t=f;pa='Pausa '}else t=s.left-(el-s.fr)}else t=s.left-el;
 const e=$('ftm');if(e){e.textContent=pa+mmss(t);e.classList.toggle('low',!pa&&t<20)}
}
function drawFollow(){
 if(MODE!=='follow')return;
 const hp=hostPeer(),bye='<button class="btn sec" id="fx">Salir de la sala</button>';
 if(!hp){FP=null;lastPres=null;put('<h2>Sala '+esc(FOLLOW.toUpperCase())+'</h2><p>Esperando al coordinador. Cuando empiece la partida vas a ver el caso acá.</p>'+bye);$('fx').onclick=leaveFollow;return}
 const s=hp.presence;
 if(s===lastPres)return;
 lastPres=s;FP=hp;
 const c=CASES.find(x=>x.id===s.id);
 if(s.scr==='eval'){drawFollowEval(s);return}
 if(s.scr!=='round'||!c||!(s.qi>=0&&s.qi<3)){
  put('<h2>Sala '+esc(FOLLOW.toUpperCase())+'</h2><div class="card"><h3>'+esc(String(s.m||'El coordinador está preparando la partida.'))+'</h3><div class="hearts" aria-label="'+(+s.lives||0)+' vidas">'+heartsN(+s.lives||0)+'</div><p class="muted"><b>'+(+s.score||0)+'</b> puntos del equipo</p></div>'+bye);
  $('fx').onclick=leaveFollow;return;
 }
 const q=c.q[s.qi],cv=caseView(c,+s.tk||0,!!s.hint),img=cv.img,rows=cv.rows,done=s.a>=0;
 const perm=Array.isArray(s.perm)&&s.perm.length===4?s.perm:[0,1,2,3],hid=Array.isArray(s.hid)?s.hid:[];
 /* Las marcas confirmadas llegan como un texto corto, con un dígito por ítem (0 es sin marcar). */
 const fnm=Array.isArray(s.nm)?s.nm.map(String):[],fkey=s.id+'|'+(+s.rc||0);
 if(!FK||FK.key!==fkey)FK={key:fkey,m:[],d:false,o:false,off:null};
 const off=c.ck&&typeof s.ck==='string'&&s.ck.length===ST[c.ck.e].it.length&&/^[0-3]+$/.test(s.ck)?s.ck.split('').map(Number):null;
 if(off&&!FK.off)FK.o=true;
 FK.off=off;
 let h='<div class="hud"><div><b>Nivel '+((+s.lv||0)+1)+'</b><div class="muted">Ronda '+((+s.ri||0)+1)+' de '+(+s.n||1)+'</div></div><div class="tm" id="ftm">'+mmss(s.left)+'</div><div style="text-align:right"><div class="hearts" aria-label="'+(+s.lives||0)+' vidas">'+heartsN(+s.lives||0)+'</div><div class="muted"><b>'+(+s.score||0)+'</b> puntos</div></div></div>'
 +'<div class="fb ok" style="margin-top:10px"><strong>Estás viendo la partida en vivo</strong>Solo quien coordina responde. Sala '+esc(FOLLOW.toUpperCase())+'.</div>'
 +'<h2>'+c.id+' '+esc(c.t)+'</h2>'+rolesHTML(fnm,+s.rc||0)+'<p>'+esc(c.ctx)+'</p>'+imgHTML(img);
 if(c.tomas)h+='<div class="chips">'+c.tomas.map((t,i)=>'<span class="chip" aria-pressed="'+(i===s.tk)+'">Toma '+(i+1)+', '+t.h+'</span>').join('')+'</div>';
 h+=tableHTML(rows);
 h+=obsHTML(c,FK,'follow',obsWho(fnm,+s.rc||0));
 if(s.msg)h+='<div class="fb '+(s.mt==='ok'?'ok':'warn')+'">'+esc(String(s.msg))+'</div>';
 h+='<div class="card"><div class="qn">Pregunta '+(s.qi+1)+' de 3, '+QL[s.qi]+'</div><h3>'+esc(q.q)+'</h3>';
 const ak=s.id+'|'+(+s.rc||0)+'|'+s.qi,mine=FA[ak];
 perm.forEach(i=>{
  let cl='opt';if(mine!=null&&i===mine)cl+=(i===0?' ok':' bad');
  h+='<button class="'+cl+'" type="button" data-fa="'+i+'"'+(mine!=null?' disabled':'')+(hid.includes(i)?' hidden':'')+'>'+esc(q.o[i]||'')+'</button>';
 });
 h+=(mine==null?'<p class="muted">Tocá tu opción para ver si es correcta. La respuesta del equipo la marca quien coordina.</p>':'')+'</div>';
 if(mine!=null)h+=myFb(q,mine);
 else if(done)h+='<div class="fb warn">Quien coordina ya marcó la respuesta del equipo. Podés tocar tu opción para ver si acertaste.</div>';
 h+=bye;
 put(h,false);$('fx').onclick=leaveFollow;obsBind(c,FK,'follow');ftick();
 on('[data-fa]',b=>b.onclick=()=>{if(FA[ak]!=null)return;FA[ak]=+b.dataset.fa;FPR.ak=ak;FPR.a=FA[ak];fsend();lastPres=null;drawFollow()});
}
/* Devolución para quien juega desde su celular: solo su elección, sin mostrar la opción correcta. */
const FA={};
function myFb(q,i){const ok=i===0;return '<div class="fb '+(ok?'ok':'bad')+'"><strong>'+(ok?'Tu respuesta es correcta.':'Tu respuesta es incorrecta.')+'</strong>'+ver(q.p||q.w)+'<div class="src">Fuente: '+ver(q.s)+'</div></div>'}
function viewerShow(id){
 const c=CASES.find(x=>x.id===id);
 V={c,qi:0,tk:0,rev:false,mine:null,perm:shuffle([0,1,2,3]),k:{m:[],d:false,o:false}};
 drawV(true);
}
function drawV(sc){
 const c=V.c,q=c.q[V.qi],cv=caseView(c,V.tk,V.rev),img=cv.img,rows=cv.rows,ix=CASES.indexOf(c);
 let h='<div class="row2"><button class="btn sec sm" id="vp">Elegir otro caso</button><button class="btn sec sm" id="vh">Inicio</button></div>'
 +'<h2>Nivel '+(c.lv+1)+', '+c.id+' '+esc(c.t)+'</h2><p>'+esc(c.ctx)+'</p>'+imgHTML(img);
 if(c.tomas)h+='<div class="chips">'+c.tomas.map((t,i)=>'<button class="chip" data-t="'+i+'" aria-pressed="'+(i===V.tk)+'">Toma '+(i+1)+', '+t.h+'</button>').join('')+'</div>';
 h+=tableHTML(rows);
 h+=obsHTML(c,V.k,'solo','');
 h+='<div class="card"><div class="qn">Pregunta '+(V.qi+1)+' de 3, '+QL[V.qi]+'</div><h3>'+esc(q.q)+'</h3>';
 V.perm.forEach(i=>{
  let cl='opt';if(V.rev&&i===V.mine)cl+=(i===0?' ok':' bad');
  h+='<button class="'+cl+'" type="button" data-i="'+i+'"'+(V.rev?' disabled':'')+'>'+esc(q.o[i])+'</button>';
 });
 if(V.rev)h+=myFb(q,V.mine);
 else h+='<p class="muted">Tocá tu opción. Vas a ver si es correcta o incorrecta, con su explicación.</p>';
 h+='<div class="row2"><button class="btn sec sm" id="qp"'+(V.qi===0?' disabled':'')+'>Pregunta anterior</button><button class="btn sec sm" id="qn"'+(V.qi===2?' disabled':'')+'>Pregunta siguiente</button></div></div>'
 +'<div class="row2"><button class="btn sm" id="cp"'+(ix===0?' disabled':'')+'>Caso anterior</button><button class="btn sm" id="cn"'+(ix===CASES.length-1?' disabled':'')+'>Caso siguiente</button></div>';
 put(h,sc===true);
 on('[data-i]',b=>b.onclick=()=>{if(!V.rev){V.mine=+b.dataset.i;V.rev=true;drawV(false)}});
 on('[data-t]',b=>b.onclick=()=>{V.tk=+b.dataset.t;drawV(false)});
 $('vp').onclick=viewerPick;$('vh').onclick=home;
 obsBind(c,V.k,'solo',()=>{V.k.d=true;V.k.o=true;drawV(false)});
 if($('ckx'))$('ckx').onclick=()=>{V.k={m:[],d:false,o:true};drawV(false)};
 const go=d=>{V.qi+=d;V.rev=false;V.mine=null;V.perm=shuffle([0,1,2,3]);drawV(true)};
 $('qp').onclick=()=>go(-1);$('qn').onclick=()=>go(1);
 $('cp').onclick=()=>viewerShow(CASES[ix-1].id);$('cn').onclick=()=>viewerShow(CASES[ix+1].id);
}
window.addEventListener('pagehide',stop);
home();
</script>
